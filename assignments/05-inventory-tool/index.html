<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href="./style.css">
        <script src="./script.js" defer></script>
    </head>
    <body>
        <div id="root"></div> 
        <div id="new">
            <form id="newProduct">
                <label for="name">Product Name:</label>
                <input id="product" type="text" name="name" placeholder="Enter Product..."><br>
                <label for="price">Product Price:</label>
                <input id="product" type="number" min="0.00" step="0.01" name="price" placeholder="Enter Price..."><br>
                <label for="description">Product Description:</label>
                <textarea name="description" id="product" placeholder="Enter Description..."></textarea><br>
                <label for="image">Product Image:</label>
                <input id="product" type="url" name="image" placeholder="Enter Image URL..."><br>
                <label for="category">Product Category:</label>
                <select name="category" id="product" placeholder="Select Category"></select><br>
                <input type="submit" value="Submit Product">
            </form>
        </div>
    </body>
</html>
