<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href="./style.css">
        <script src="./script.js" defer></script>
    </head>
    <body>
        <div id="root"></div> 
        <div id="new">
            <form id="newProduct">
                <label for="name">Product Name:</label>
                <input id="productName" type="text" name="name" placeholder="Enter Product..." required><br>
                <label for="price">Product Price:</label>
                <input id="productPrice" type="number" min="0.00" step="0.01" name="price" placeholder="Enter Price..." required><br>
                <label for="description">Product Description:</label>
                <textarea name="description" id="productDesc" placeholder="Enter Description..." required></textarea><br>
                <label for="image">Product Image:</label>
                <input id="productImg" type="url" name="image" placeholder="Enter Image URL..." required><br>
                <label for="category">Product Category:</label>
                <select name="category" id="productCate" placeholder="Select Category" required></select><br>
                <input type="submit" value="Submit Product">
            </form>
        </div>
    </body>
</html>
